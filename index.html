<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Guru Bertugas SMKKT</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Laporan SMKKT">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="./logo-lagutu.png">
    <link rel="icon" type="image/png" href="./logo-lagutu.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 80%); background-attachment: fixed; min-height: 100vh; }
        @media print { body { background-color: white; color: black; background-image: none; } .no-print { display: none !important; } .print-break-inside-avoid { break-inside: avoid; } }
        ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; } ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
        .mobile-table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; } .mobile-table-scroll table { min-width: 720px; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); }
        .glass-input { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); color: #f1f5f9; transition: all 0.3s ease; }
        .glass-input:focus { background: rgba(0, 0, 0, 0.4); border-color: #818cf8; outline: none; box-shadow: 0 0 0 2px rgba(129, 140, 248, 0.2); }
        @media (max-width: 767px) { .mobile-report-card { border: 1px solid rgba(255,255,255,0.1); border-radius: 0.9rem; padding: 1rem; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); } }
        .custom-checkbox input:checked + div { background-color: #818cf8; border-color: #818cf8; box-shadow: 0 0 10px rgba(129, 140, 248, 0.4); } .custom-checkbox input:checked + div svg { display: block; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6mGf_m7gCc3uKzEOcl7sDmsmx7fSUCVE_5K4fU5rlj9Y_tzNo1OdLSI4uGS4j2nrD7Q/exec";

        // Semua permintaan ditulis/dibaca melalui satu fungsi. text/plain mengelakkan preflight CORS pada Apps Script.
        const api = async (payload) => {
            const res = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
            const d = await res.json();
            if (d.status && d.status !== 'success') { const e = new Error(d.message || 'Ralat tidak diketahui.'); e.status = d.status; throw e; }
            return d;
        };
        // Pemilik laporan = ID sama ATAU nama sama (rekod lama guna ID jenis "t_5")
        const isOwner = (task, user) => !!task && !!user && ((task.teacherId && task.teacherId === user.id) || String(task.teacherName||'').trim().toUpperCase() === String(user.name||'').trim().toUpperCase());
        
		const formatDateDisplay = (dateStr) => {
			if (!dateStr) return "";
			const parts = dateStr.split("-");
			if (parts.length !== 3) return dateStr;
			return `${parts[2]}/${parts[1]}/${parts[0]}`;
		};
				
		const getTodayMalaysia = () => {
			const now = new Date();
			const malaysia = new Date(
				now.toLocaleString('en-US', {
					timeZone: 'Asia/Kuala_Lumpur'
				})
			);

			return malaysia.toISOString().split('T')[0];
		};
		
        const DUTIES = [
            { id: 1, title: "MENGURUS PERHIMPUNAN PAGI DAN CATATAN", short: "Perhimpunan" },
            { id: 2, title: "MENGAWAL PINTU MASUK PAGI", short: "Pintu Masuk" },
            { id: 3, title: "KAWALAN WAKTU REHAT DI KANTIN", short: "Kantin/Rehat" },
            { id: 4, title: "RONDAAN BLOK, SURAU DAN TANDAS", short: "Rondaan" },
            { id: 5, title: "LAPORAN KEHADIRAN, SAKIT DAN AKTIVITI", short: "Kehadiran & Aktiviti" }
        ];

        const AKTIVITI_OPTIONS = [ "PERJUMPAAN RUMAH SUKAN", "PERJUMPAAN BADAN BERUNIFORM", "PERJUMPAAN 1 MURID 1 SUKAN", "PERJUMPAAN KELAB DAN PERSATUAN", "PERJUMPAAN SECARA ONLINE", "KELAS TAMBAHAN TINGKATAN 4 DAN 5" ];

        // --- RUBRIK DAN PENERANGAN ---
        const OP_PINTU = [
            { v: "Sangat Baik", d: "Kawalan berjalan lancar, murid mematuhi peraturan dan masuk tepat pada waktunya." },
            { v: "Baik", d: "Kawalan berjalan dengan baik dengan sedikit teguran atau kes lewat." },
            { v: "Memerlukan Perhatian", d: "Terdapat isu murid lewat, pakaian tidak patuh peraturan atau kawalan kurang lancar." },
            { v: "Tidak Memuaskan", d: "Sila nyatakan isu dan masalah di bahagian bawah." }
        ];

        const OP_KANTIN = [
            { v: "Sangat Baik", d: "Bersih, kemas dan teratur; tiada sampah atau sisa makanan ketara." },
            { v: "Baik", d: "Bersih dan teratur dengan sedikit kekotoran yang dapat ditangani segera." },
            { v: "Memerlukan Perhatian", d: "Beberapa kawasan kurang bersih dan terdapat sampah/sisa makanan." },
            { v: "Tidak Memuaskan", d: "Kotor, tidak terurus dan memerlukan tindakan pembersihan segera." }
        ];

        const OP_DISIPLIN = [
            { v: "Sangat Baik", d: "Murid berdisiplin, beratur, mematuhi peraturan dan menjaga kebersihan." },
            { v: "Baik", d: "Kebanyakan murid berdisiplin dengan sedikit teguran." },
            { v: "Memerlukan Perhatian", d: "Beberapa murid perlu ditegur berkaitan disiplin dan peraturan." },
            { v: "Tidak Memuaskan", d: "Disiplin murid kurang terkawal, perlukan tindakan segera." }
        ];

        const OP_BLOK = [
            { v: "Sangat Baik", d: "100% kelas memenuhi semua 3 kriteria." },
            { v: "Baik", d: "≥75% kelas memenuhi sekurang-kurangnya 2 daripada 3 kriteria." },
            { v: "Memuaskan", d: "≥50% kelas memenuhi sekurang-kurangnya 2 daripada 3 kriteria." },
            { v: "Tidak Memuaskan", d: "<50% kelas memenuhi sekurang-kurangnya 2 daripada 3 kriteria." }
        ];

        const OP_SURAU = [
            { v: "Sangat Baik", d: "Surau bersih, kemas dan teratur. Ruang solat, lantai, tempat wuduk serta rak al-Quran terurus." },
            { v: "Baik", d: "Surau bersih dan kemas dengan sedikit kekotoran yang tidak menjejaskan keselesaan." },
            { v: "Memuaskan", d: "Surau agak kurang bersih/kemas. Memerlukan perhatian pembersihan." },
            { v: "Tidak Memuaskan", d: "Surau kotor atau tidak terurus. Memerlukan tindakan segera." }
        ];

        const OP_TANDAS = [
            { v: "Sangat Baik", d: "Tandas bersih, tiada bau, lantai kering dan kemudahan baik serta terurus." },
            { v: "Baik", d: "Tandas bersih dan terurus dengan sedikit kekotoran tidak menjejaskan fungsi." },
            { v: "Kurang Memuaskan", d: "Agak kotor, bau kurang menyenangkan dan perlukan perhatian." },
            { v: "Tidak Memuaskan", d: "Kotor, berbau atau tidak terurus. Perlukan tindakan pembersihan segera." }
        ];

        window.handlePrint = function() { setTimeout(() => { window.focus(); window.print(); }, 200); };

        // --- COMPONENTS ---

        const DetailedRadio = ({ label, options, value, onChange }) => (
            <div className="mb-6">
                <label className="block text-sm font-bold text-indigo-300 mb-3 uppercase tracking-wide border-b border-indigo-500/30 pb-2">{label}</label>
                <div className="space-y-2">
                    {options.map(opt => (
                        <label key={opt.v} className={`flex items-start gap-4 p-3 rounded-xl border-2 cursor-pointer transition-all ${value === opt.v ? 'bg-indigo-500/20 border-indigo-400 shadow-[0_0_15px_rgba(129,140,248,0.2)]' : 'bg-black/20 border-white/10 hover:bg-white/5 hover:border-white/30'}`}>
                            <div className="relative flex items-center justify-center mt-1">
                                <input type="radio" className="sr-only" name={label} value={opt.v} checked={value === opt.v} onChange={() => onChange(opt.v)} />
                                <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center ${value === opt.v ? 'border-indigo-400' : 'border-slate-500'}`}>
                                    {value === opt.v && <div className="w-2.5 h-2.5 bg-indigo-400 rounded-full"></div>}
                                </div>
                            </div>
                            <div className="flex-1">
                                <div className={`font-bold text-sm ${value === opt.v ? 'text-indigo-100' : 'text-slate-300'}`}>{opt.v}</div>
                                <div className="text-[11px] text-slate-400 mt-1 leading-snug">{opt.d}</div>
                            </div>
                        </label>
                    ))}
                </div>
            </div>
        );

        const MultiImageUpload = ({ images, setImages, label }) => {
            const MAX_SIZE = 5 * 1024 * 1024; // 5MB
            
            const compressImage = (file) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width, height = img.height;
                            if (width > 1280) { height = Math.round((height * 1280) / width); width = 1280; }
                            canvas.width = width; canvas.height = height;
                            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', 0.7));
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const handleUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (images.length + files.length > 3) { alert('Maksimum 3 gambar sahaja.'); return; }
                const newImages = [...images];
                for(let file of files) {
                    if(!file.type.startsWith('image/')) continue;
                    if(file.size > MAX_SIZE && !window.confirm(`Saiz ${file.name} besar. Ia akan dikecilkan. Teruskan?`)) continue;
                    const b64 = await compressImage(file);
                    newImages.push(b64);
                }
                setImages(newImages);
                e.target.value = '';
            };

            const removeImage = (index) => { setImages(images.filter((_, i) => i !== index)); };

            return (
                <div className="mt-8 border-t border-white/10 pt-6">
                    <label className="block text-sm font-semibold text-slate-300 mb-1">{label} (Maksimum 3)</label>
                    <p className="text-xs text-slate-400 mb-4">Sila muat naik bukti bergambar berkaitan tugasan anda.</p>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        {images.map((src, i) => (
                            <div key={i} className="relative h-32 rounded-xl border border-white/20 overflow-hidden group bg-black/50">
                                <img src={src} className="w-full h-full object-cover" alt="Preview" />
                                <button type="button" onClick={() => removeImage(i)} className="absolute inset-0 bg-red-500/80 text-white flex items-center justify-center opacity-0 group-hover:opacity-100 transition backdrop-blur-sm text-xs font-bold gap-1"><i className="ph-bold ph-trash"></i> Padam</button>
                            </div>
                        ))}
                        {images.length < 3 && (
                            <label className="cursor-pointer bg-black/20 border-2 border-dashed border-white/20 hover:border-indigo-400 rounded-xl flex flex-col items-center justify-center h-32 transition group">
                                <i className="ph ph-plus text-2xl text-slate-500 group-hover:text-indigo-400 mb-1"></i>
                                <span className="text-[10px] font-medium text-slate-400 group-hover:text-indigo-300 text-center px-2">Tambah<br/>Gambar</span>
                                <input type="file" accept="image/*" multiple onChange={handleUpload} className="hidden" />
                            </label>
                        )}
                    </div>
                </div>
            );
        };

        const CheckboxGroup = ({ label, options, value, onChange }) => {
            let parsed = [];
            try { parsed = value ? JSON.parse(value) : []; if(!Array.isArray(parsed)) parsed = []; } 
            catch(e) { parsed = [{type:'other', text: value||''}]; }
            const stdOps = parsed.filter(v=>v.type==='standard').map(v=>v.text);
            const otherObj = parsed.find(v=>v.type==='other');
            
            const handleStd = (opt, chk) => {
                let n = [...parsed];
                if(chk) { if(!n.some(v=>v.type==='standard'&&v.text===opt)) n.push({type:'standard', text:opt}); }
                else n = n.filter(v=>!(v.type==='standard'&&v.text===opt));
                onChange(JSON.stringify(n));
            };
            const handleOtherChk = (chk) => {
                let n = [...parsed];
                if(chk) { if(!otherObj) n.push({type:'other', text:''}); }
                else n = n.filter(v=>v.type!=='other');
                onChange(JSON.stringify(n));
            };
            return (
                <div className="mt-4">
                    <label className="block text-sm font-semibold text-slate-300 mb-3 uppercase tracking-wide">{label}</label>
                    <div className="space-y-3">
                        {options.map(opt => (
                            <label key={opt} className="flex items-start gap-3 cursor-pointer group custom-checkbox">
                                <div className="relative mt-0.5"><input type="checkbox" className="sr-only" checked={stdOps.includes(opt)} onChange={e=>handleStd(opt, e.target.checked)}/><div className="w-5 h-5 border border-white/20 rounded bg-black/20 group-hover:border-indigo-400 flex items-center justify-center"><svg className="w-3.5 h-3.5 text-white hidden pointer-events-none" viewBox="0 0 14 14" fill="none"><path d="M3 8L6 11L11 3.5" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" stroke="currentColor"></path></svg></div></div>
                                <span className="text-sm font-medium text-slate-300 group-hover:text-white">{opt}</span>
                            </label>
                        ))}
                        <div className="flex flex-col sm:flex-row gap-3 pt-2">
                            <label className="flex items-center gap-3 cursor-pointer group custom-checkbox shrink-0 mt-1">
                                <div className="relative"><input type="checkbox" className="sr-only" checked={!!otherObj} onChange={e=>handleOtherChk(e.target.checked)}/><div className="w-5 h-5 border border-white/20 rounded bg-black/20 group-hover:border-indigo-400 flex items-center justify-center"><svg className="w-3.5 h-3.5 text-white hidden pointer-events-none" viewBox="0 0 14 14" fill="none"><path d="M3 8L6 11L11 3.5" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" stroke="currentColor"></path></svg></div></div>
                                <span className="text-sm font-medium text-slate-300 group-hover:text-white">Lain-lain:</span>
                            </label>
                            <textarea rows="2" className={`w-full glass-input p-2 rounded text-sm ${!otherObj?'opacity-40':''}`} placeholder="Nyatakan..." value={otherObj?.text||''} onChange={e=>{let n=[...parsed]; const idx=n.findIndex(v=>v.type==='other'); if(idx>-1)n[idx].text=e.target.value; else n.push({type:'other',text:e.target.value}); onChange(JSON.stringify(n));}} disabled={!otherObj}></textarea>
                        </div>
                    </div>
                </div>
            );
        };

        const FormSection = ({ title, icon, children }) => (
            <div className="glass-panel p-6 md:p-8 rounded-xl mt-6 relative overflow-hidden"><div className="absolute top-0 left-0 w-1.5 h-full bg-indigo-400"></div>
                <h3 className="text-xl font-bold text-white mb-6 border-b border-white/10 pb-4 flex items-center gap-3"><div className="bg-indigo-500/20 p-2 rounded-lg text-indigo-300"><i className={`ph-fill ${icon} text-2xl`}></i></div> {title}</h3>
                {children}
            </div>
        );

        // --- MAIN APP VIEWS ---

        const LoginScreen = ({ onLogin, teachers, loading }) => {
            const [mode, setMode] = React.useState('login');
            const [sel, setSel] = React.useState(''); const [ic, setIc] = React.useState('');
            const [regName, setRegName] = React.useState(''); const [regPin, setRegPin] = React.useState(''); const [regPin2, setRegPin2] = React.useState('');
            const [err, setErr] = React.useState(''); const [ok, setOk] = React.useState(''); const [busy, setBusy] = React.useState(false);

            const doLogin = async (e) => {
                e.preventDefault(); setErr(''); setBusy(true);
                try { const d = await api({ action: 'LOGIN', id: sel, pin: ic }); onLogin(d.user, ic, d); }
                catch (ex) { setErr(ex.message); } finally { setBusy(false); }
            };
            const doRegister = async (e) => {
                e.preventDefault(); setErr(''); setOk('');
                if (!/^\d{4}$/.test(regPin)) return setErr('PIN mesti 4 digit nombor.');
                if (regPin !== regPin2) return setErr('PIN tidak sepadan.');
                setBusy(true);
                try { const d = await api({ action: 'REGISTER', name: regName, pin: regPin }); setOk(d.message); setRegName(''); setRegPin(''); setRegPin2(''); }
                catch (ex) { setErr(ex.message); } finally { setBusy(false); }
            };
            const tab = (m, t) => <button type="button" onClick={()=>{setMode(m);setErr('');setOk('');}} className={`flex-1 py-2 rounded-lg text-sm font-bold transition ${mode===m?'bg-indigo-500 text-white':'text-slate-300 hover:bg-white/10'}`}>{t}</button>;
            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="glass-panel rounded-2xl p-8 w-full max-w-md relative z-10 text-center overflow-hidden">
                        <img src="./LOGO-SMKKT.png" className="w-24 h-24 mx-auto mb-4 bg-white/10 rounded-full p-2 backdrop-blur-sm" alt="Logo" />
                        <h2 className="text-2xl font-bold text-white">SMK KEM TERENDAK</h2>
                        <p className="text-indigo-300 text-xs font-bold mb-6 uppercase tracking-wider mt-1">Sistem Laporan Guru Bertugas</p>
                        {loading ? <div className="animate-pulse text-indigo-300 text-sm py-4 border border-indigo-500/30 bg-indigo-500/10 rounded-lg"><i className="ph-bold ph-spinner animate-spin text-xl mb-1 block"></i>Memuat turun data...</div> : (
                            <div className="text-left">
                                <div className="flex gap-2 bg-black/20 p-1 rounded-xl mb-5">{tab('login','Log Masuk')}{tab('register','Daftar Guru Baharu')}</div>
                                {err && <div className="bg-rose-500/20 border border-rose-500/30 text-rose-200 p-3 rounded-lg text-sm flex items-center gap-2 mb-4"><i className="ph-fill ph-warning-circle text-lg"></i> {err}</div>}
                                {ok && <div className="bg-emerald-500/20 border border-emerald-500/30 text-emerald-200 p-3 rounded-lg text-sm flex items-center gap-2 mb-4"><i className="ph-fill ph-check-circle text-lg"></i> {ok}</div>}
                                {mode === 'login' ? (
                                    <form onSubmit={doLogin} className="space-y-4">
                                        <div><label className="text-xs font-bold text-slate-300">Pilih Nama</label>
                                            <select className="w-full glass-input p-3 rounded-lg mt-1 outline-none" value={sel} onChange={e=>setSel(e.target.value)} required>
                                                <option value="" disabled className="text-slate-800">-- Sila Pilih Nama --</option>
                                                {teachers.map(t=><option key={t.id} value={t.id} className="text-slate-800">{t.name}</option>)}
                                            </select></div>
                                        <div><label className="text-xs font-bold text-slate-300">4 Digit Akhir Kad Pengenalan</label>
                                            <input type="password" inputMode="numeric" maxLength="4" placeholder="Cth: 5954" className="w-full glass-input p-3 rounded-lg mt-1 outline-none" value={ic} onChange={e=>setIc(e.target.value.replace(/\D/g,''))} required /></div>
                                        <button type="submit" disabled={busy} className="w-full bg-indigo-500 hover:bg-indigo-400 disabled:opacity-50 p-3.5 rounded-lg text-white font-bold shadow-[0_0_15px_rgba(99,102,241,0.4)] mt-2 transition-colors">{busy?'Menyemak...':'Log Masuk'}</button>
                                    </form>
                                ) : (
                                    <form onSubmit={doRegister} className="space-y-4">
                                        <div><label className="text-xs font-bold text-slate-300">Nama Penuh (seperti dalam KP)</label>
                                            <input type="text" className="w-full glass-input p-3 rounded-lg mt-1 outline-none uppercase" value={regName} onChange={e=>setRegName(e.target.value)} required /></div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div><label className="text-xs font-bold text-slate-300">4 Digit Akhir KP</label><input type="password" inputMode="numeric" maxLength="4" className="w-full glass-input p-3 rounded-lg mt-1 outline-none" value={regPin} onChange={e=>setRegPin(e.target.value.replace(/\D/g,''))} required /></div>
                                            <div><label className="text-xs font-bold text-slate-300">Sahkan 4 Digit</label><input type="password" inputMode="numeric" maxLength="4" className="w-full glass-input p-3 rounded-lg mt-1 outline-none" value={regPin2} onChange={e=>setRegPin2(e.target.value.replace(/\D/g,''))} required /></div>
                                        </div>
                                        <p className="text-[11px] text-slate-400">Pendaftaran baharu perlu diluluskan oleh pentadbir sebelum anda boleh log masuk.</p>
                                        <button type="submit" disabled={busy} className="w-full bg-indigo-500 hover:bg-indigo-400 disabled:opacity-50 p-3.5 rounded-lg text-white font-bold shadow-[0_0_15px_rgba(99,102,241,0.4)] transition-colors">{busy?'Menghantar...':'Daftar'}</button>
                                    </form>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const MyReports = ({ reports, user, onOpen, onEdit, onDelete, onNew }) => {
            const items = [];
            Object.values(reports).forEach(r => Object.keys(r.tasks || {}).forEach(id => { const t = r.tasks[id]; if (isOwner(t, user)) items.push({ date: r.date, day: r.day, dutyId: Number(id), reviewed: r.status === 'reviewed', imgs: (t.images||[]).length }); }));
            items.sort((a, b) => b.date.localeCompare(a.date) || a.dutyId - b.dutyId);
            return (
                <div className="max-w-3xl mx-auto">
                    <div className="flex items-end justify-between mb-5"><div><h2 className="text-2xl font-bold text-white">Laporan Saya</h2><p className="text-sm text-indigo-200 mt-1">Anda hanya boleh mengedit atau memadam laporan anda sendiri.</p></div>

									src={
										url.startsWith("data:image")
											? url
											: url.replace(
												"https://drive.google.com/uc?export=view&id=",
												"https://drive.google.com/thumbnail?id="
											  ) + "&sz=w1000"
									}
									className="w-full h-32 object-cover rounded"
									alt="Lampiran"
									onError={e => {

											'<div class="text-xs text-rose-500 flex h-full items-center justify-center font-medium bg-rose-50 rounded border border-rose-200">Gagal Paparan. Sila buka link.</div>';
									}}
								/>

                            </div>

            const t = reportData.tasks;
            const rt = text => text ? String(text).split('\n').map((l,i)=><React.Fragment key={i}>{l}<br/></React.Fragment>) : <span className="text-slate-400 italic">Tiada catatan</span>;
            
            const formatAktiviti = (val) => {
                if(!val) return <span className="text-slate-400 italic">-</span>;
                try {
                    const p = JSON.parse(val); if(p.length === 0) return <span className="text-slate-400 italic">-</span>;
                    return <ul className="list-disc pl-5 mt-1">{p.map((x,i)=><li key={i}>{x.type==='other' ? `Lain-lain: ${x.text}` : x.text}</li>)}</ul>;
                } catch(e) { return val; }
            };

            const renderWithDesc = (val, options) => {
                if (!val) return <span className="text-slate-400 italic">-</span>;
                const opt = options.find(o => o.v === val);
                if (!opt) return <span className="font-bold text-slate-800">{val}</span>;
                return (
                    <div className="mt-1">
                        <span className="font-bold text-slate-800 text-[14px] bg-slate-200/50 px-2 py-0.5 rounded">{val}</span>
                        <div className="text-slate-600 text-[12px] mt-1.5 ml-1 border-l-2 border-indigo-400 pl-2.5 bg-indigo-50/30 py-1 pr-2 rounded-r leading-snug">{opt.d}</div>

                            <div className="text-sm bg-slate-50 p-5 border border-slate-200 rounded-lg shadow-sm">
                                <div className="flex gap-12 mb-4">
                                    <div className="font-semibold text-slate-600">Kehadiran Guru: <span className="text-lg font-bold text-slate-900 ml-2">{t[5]?.guru_hadir||'-'} / {t[5]?.guru_total||'-'}</span></div>
                                    <div className="font-semibold text-slate-600">Kehadiran AKP: <span className="text-lg font-bold text-slate-900 ml-2">{t[5]?.akp_hadir||'-'} / {t[5]?.akp_total||'-'}</span></div>
                                </div>
                                <div className="font-bold text-slate-700 mb-1 border-t pt-3">Senarai Tidak Hadir / Catatan:</div>
                                <div className="pl-3 border-l-2 border-slate-400 whitespace-pre-line bg-white p-3 rounded text-sm">{t[5]?.guru_tak_hadir||'-'}</div>
                            </div>
                        </div>

                        {/* Perhimpunan & Pintu Masuk */}
                        <div className="grid grid-cols-1 gap-6 mb-8 print-break-inside-avoid">
                            <div className="border border-slate-200 p-5 rounded-lg bg-slate-50 shadow-sm"><h3 className="font-bold border-b pb-2 mb-3 text-sm text-indigo-900 uppercase">C. Perhimpunan Pagi</h3><div className="text-sm bg-white p-3 rounded border border-slate-100 min-h-[60px]">{rt(t[1]?.notes)}</div></div>
                            <div className="border border-slate-200 p-5 rounded-lg bg-slate-50 shadow-sm"><h3 className="font-bold border-b pb-2 mb-3 text-sm text-indigo-900 uppercase">D. Kawalan Pintu Masuk</h3>
                                <div className="text-sm mb-4"><span className="font-bold text-slate-600 block mb-1">Status Kawalan:</span>{renderWithDesc(t[2]?.status_pintu, OP_PINTU)}</div>
                                <div className="text-sm font-bold text-slate-600 border-t pt-2">Isu/Masalah:</div><div className="text-sm bg-white p-2 rounded border border-slate-100 mt-1">{rt(t[2]?.isu_pintu)}</div>
                            </div>
                        </div>

                        {/* Kantin */}
                        <div className="mb-8 border border-slate-200 p-5 rounded-lg print-break-inside-avoid bg-slate-50 shadow-sm"><h3 className="font-bold border-b pb-2 mb-4 text-sm text-indigo-900 uppercase">E. Kawalan Rehat & Koperasi</h3>
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-5 text-sm">
                                <div className="bg-white p-4 rounded shadow-sm border border-slate-100"><span className="font-bold text-slate-500 text-xs block mb-2 uppercase tracking-wider">Kantin</span>{renderWithDesc(t[3]?.kantin, OP_KANTIN)}</div>
                                <div className="bg-white p-4 rounded shadow-sm border border-slate-100"><span className="font-bold text-slate-500 text-xs block mb-2 uppercase tracking-wider">Koperasi</span>{renderWithDesc(t[3]?.koperasi, OP_KANTIN)}</div>
                                <div className="bg-white p-4 rounded shadow-sm border border-slate-100"><span className="font-bold text-slate-500 text-xs block mb-2 uppercase tracking-wider">Disiplin</span>{renderWithDesc(t[3]?.disiplin, OP_DISIPLIN)}</div>
                            </div>
                            <div className="text-sm font-bold text-slate-600 border-t pt-3">Catatan Tambahan:</div><div className="text-sm mt-1 bg-white p-3 rounded border border-slate-100">{rt(t[3]?.notes)}</div>
                        </div>

                        {/* Rondaan */}
                        <div className="mb-8 border border-slate-200 p-5 rounded-lg print-break-inside-avoid bg-slate-50 shadow-sm"><h3 className="font-bold border-b pb-2 mb-4 text-sm text-indigo-900 uppercase">F. Rondaan Blok, Surau & Tandas</h3>
                            <div className="bg-indigo-50 border border-indigo-100 p-4 mb-6 rounded-lg text-sm shadow-sm flex gap-3">
                                <i className="ph-fill ph-info text-2xl text-indigo-500"></i>
                                <div>
                                    <p className="font-bold text-xs uppercase tracking-wider mb-1 text-indigo-800">Kriteria Kebersihan Blok:</p>
                                    <ol className="list-decimal list-inside text-[13px] space-y-0.5 text-indigo-900 font-medium ml-1">
                                        <li>Kelas & koridor luar disapu bersih.</li>
                                        <li>Meja kemas & tersusun.</li>
                                        <li>Cermin tingkap bersih.</li>
                                    </ol>
                                </div>
                            </div>

                            <div className="mb-6"><h4 className="font-bold text-slate-700 text-sm mb-3 border-b-2 border-slate-200 pb-1">Status Kebersihan Blok Kelas:</h4>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 text-sm">
                                    {['tg1','tg2','tg3','tg4','tg5'].map((tg, i) => (
                                        <div key={tg} className="bg-white p-3.5 rounded-lg border border-slate-200 shadow-sm"><span className="font-bold text-indigo-600 block mb-1">Tingkatan {i+1}</span>{renderWithDesc(t[4]?.[tg], OP_BLOK)}</div>
                                    ))}
                                </div>
                            </div>

                            <div className="mb-5 border-t-2 border-slate-200 pt-5"><h4 className="font-bold text-slate-700 text-sm mb-3 border-b-2 border-slate-200 pb-1">Status Fasiliti (Surau & Tandas):</h4>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                                    <div className="bg-white p-4 rounded-lg border border-slate-200 shadow-sm"><span className="font-bold text-teal-600 block mb-1">Surau (Lelaki)</span>{renderWithDesc(t[4]?.surau_l, OP_SURAU)}</div>
                                    <div className="bg-white p-4 rounded-lg border border-slate-200 shadow-sm"><span className="font-bold text-teal-600 block mb-1">Surau (Perempuan)</span>{renderWithDesc(t[4]?.surau_p, OP_SURAU)}</div>
                                    <div className="bg-white p-4 rounded-lg border border-slate-200 shadow-sm"><span className="font-bold text-sky-600 block mb-1">Tandas (Lelaki)</span>{renderWithDesc(t[4]?.tandas_l, OP_TANDAS)}</div>
                                    <div className="bg-white p-4 rounded-lg border border-slate-200 shadow-sm"><span className="font-bold text-sky-600 block mb-1">Tandas (Perempuan)</span>{renderWithDesc(t[4]?.tandas_p, OP_TANDAS)}</div>
                                </div>
                            </div>

                            <div className="text-sm font-bold text-slate-600 border-t pt-4">Catatan / Isu Kerosakan:</div><div className="text-sm mt-1 bg-white p-3 rounded border border-slate-100">{rt(t[4]?.notes)}</div>
                        </div>

                        {/* Murid & Aktiviti */}
                        <div className="mb-8 border border-slate-200 p-5 rounded-lg print-break-inside-avoid shadow-sm"><h3 className="font-bold border-b pb-2 mb-4 text-sm text-indigo-900 uppercase">G. Kehadiran Murid & Aktiviti</h3>
                            <div className="text-sm bg-slate-50 p-4 rounded border border-slate-200 mb-4 flex items-center gap-4"><span className="font-semibold text-slate-600 uppercase tracking-wide">Jum. Kehadiran Murid: </span> <span className="text-2xl font-bold text-indigo-700">{t[5]?.murid_hadir||'-'} / {t[5]?.murid_total||'-'}</span></div>
                            <div className="text-sm font-bold text-slate-700 mt-2">Senarai Sakit / Pulang Awal:</div><div className="text-sm bg-slate-50 p-3 rounded border border-slate-100 mt-1">{rt(t[5]?.murid_sakit)}</div>
                            <div className="text-sm font-bold text-slate-700 mt-4 border-t pt-3">Aktiviti Petang:</div><div className="text-sm bg-slate-50 p-3 rounded border border-slate-100 mt-1">{formatAktiviti(t[5]?.aktiviti)}</div>
                        </div>

                        {/* Lampiran */}
                        <div className="mb-8 border border-slate-200 p-5 rounded-lg print-break-inside-avoid shadow-sm"><h3 className="font-bold border-b pb-2 mb-4 text-sm text-indigo-900 uppercase">H. Lampiran Bergambar</h3>
                            <DriveImageGallery urls={t[1]?.images} title="Tugas 1: Perhimpunan" />
                            <DriveImageGallery urls={t[2]?.images} title="Tugas 2: Pintu Masuk" />
                            <DriveImageGallery urls={t[3]?.images} title="Tugas 3: Kantin/Rehat" />
                            <DriveImageGallery urls={t[4]?.images} title="Tugas 4: Rondaan Blok" />
                            {(!t[1]?.images?.length && !t[2]?.images?.length && !t[3]?.images?.length && !t[4]?.images?.length) && <div className="text-center italic text-slate-400 text-sm border-2 border-dashed border-slate-300 p-8 rounded-xl bg-slate-50">Tiada gambar direkodkan untuk laporan hari ini.</div>}
                        </div>

                        {/* Ulasan Pentadbir */}
                        <div className="mt-10 border-t-2 border-slate-800 pt-6 print-break-inside-avoid">
                            <h3 className="font-bold text-lg mb-4 flex items-center gap-2 uppercase text-slate-900"><i className="ph-fill ph-seal-check text-2xl text-indigo-600"></i> Ulasan Pentadbir</h3>
                            <div className="space-y-4">
                                {reportData.admin_comments?.map((ac, idx) => (
                                    <div key={idx} className="p-5 border-l-4 border-indigo-500 bg-indigo-50/70 rounded-r-lg shadow-sm">
                                        <div className="text-xs font-bold text-indigo-800 uppercase tracking-wider mb-2 flex items-center gap-1.5"><i className="ph-fill ph-user-circle text-lg"></i> DISAHKAN OLEH: {ac.name}</div>
                                        <div className="text-sm text-slate-800 font-medium leading-relaxed italic">"{ac.comment}"</div>
                                    </div>
                                ))}
                                {(!reportData.admin_comments || reportData.admin_comments.length === 0) && <div className="text-sm text-slate-400 italic bg-slate-50 p-5 rounded border border-slate-200">Belum ada ulasan daripada pihak pentadbir.</div>}
                            </div>
                            
                            {/* Ruangan Tambah Ulasan (Admin Sahaja) */}
                            {user?.role === 'admin' && (reportData.admin_comments?.length || 0) < 2 && (
                                <div className="no-print mt-6 bg-slate-50 p-6 rounded-xl border border-slate-200 shadow-inner">
                                    <label className="block text-xs font-bold mb-3 uppercase text-slate-600 tracking-wide">Tambah Ulasan (Oleh {user.name})</label>
                                    <textarea className="w-full border border-slate-300 rounded-lg p-4 text-sm focus:ring-2 focus:ring-indigo-400 outline-none bg-white shadow-sm" rows="3" placeholder="Taip ulasan / teguran di sini..." value={comment} onChange={e=>setComment(e.target.value)}></textarea>
                                    <button onClick={()=>{if(!comment.trim()){alert('Sila taip ulasan dahulu.'); return;} onSaveComment(comment); setComment('');}} className="mt-4 bg-slate-800 text-white px-6 py-3 rounded-lg text-sm font-bold shadow-md hover:bg-slate-700 flex items-center gap-2 transition"><i className="ph-bold ph-floppy-disk text-lg"></i> Simpan Ulasan</button>
                                </div>
                            )}
                            {user?.role === 'admin' && (reportData.admin_comments?.length || 0) >= 2 && <div className="no-print mt-5 text-xs bg-rose-50 text-rose-600 p-4 rounded-lg font-bold border border-rose-200 text-center uppercase tracking-wide">Maksimum 2 ulasan pentadbir telah dicapai.</div>}
                        </div>
                    </div>
                </div>
            );
        };

        const AdminDashboard = ({ reports, onViewReport, role, pending, onDecide }) => {
            const reportList = Object.values(reports).sort((a, b) => new Date(b.date) - new Date(a.date));
            return (
                <div className="max-w-4xl mx-auto"><div className="mb-6"><h2 className="text-2xl font-bold text-white tracking-wide">{role === 'admin' ? 'Papan Pemuka Pentadbir' : 'Arkib Laporan'}</h2><p className="text-sm text-indigo-200 mt-1">Sila pilih laporan mengikut tarikh untuk disemak.</p></div>
                    {role === 'admin' && pending && pending.length > 0 && <PendingTeachers pending={pending} onDecide={onDecide} />}
                    <div className="glass-panel overflow-hidden rounded-xl shadow-lg border-white/10"><div className="mobile-table-scroll"><table className="w-full min-w-[720px] text-left border-collapse">
                        <thead><tr className="bg-black/30 border-b border-white/10 text-slate-300 uppercase tracking-wider text-[11px]"><th className="p-4">Tarikh & Hari</th><th className="p-4 text-center">Minggu</th><th className="p-4 text-center">Tugasan Siap</th><th className="p-4 text-center">Status Laporan</th><th className="p-4 text-center">Tindakan</th></tr></thead>
                        <tbody>
                            {reportList.length===0 && <tr><td colSpan="5" className="p-8 text-center text-slate-400 italic">Tiada laporan dijumpai.</td></tr>}
                            {reportList.map(r => {
                                const count = Object.keys(r.tasks||{}).length;
                                const isComplete = count === 5;
                                return (
                                <tr key={r.date} className="border-b border-white/5 hover:bg-white/5 transition-colors"><td className="p-4"><div className="font-bold text-white text-lg">{formatDateDisplay(r.date)}</div><div className="text-[10px] text-indigo-300 uppercase tracking-widest mt-1 font-bold">{r.day}</div></td>
                                <td className="p-4 text-center text-slate-300 font-bold">{r.week||'-'}</td>
                                <td className="p-4 text-center"><span className={`px-3 py-1.5 rounded-lg border text-xs font-bold ${isComplete?'bg-indigo-500/20 text-indigo-300 border-indigo-500/30':'bg-black/30 text-white border-white/10'}`}>{count} / 5</span></td>
                                <td className="p-4 text-center">{r.status === 'reviewed' ? <span className="text-emerald-400 text-sm font-bold bg-emerald-500/10 px-3 py-1.5 rounded-full border border-emerald-500/20 shadow-sm flex items-center justify-center gap-1.5 w-max mx-auto"><i className="ph-fill ph-check-circle"></i> Disemak</span> : isComplete ? <span className="text-indigo-300 text-sm font-medium">Menunggu</span> : <span className="text-slate-500 text-sm italic">Tak Lengkap</span>}</td>
                                <td className="p-4 text-center"><button onClick={() => onViewReport(r.date)} className="bg-white/10 hover:bg-indigo-500 border border-white/10 px-6 py-2 rounded-lg text-white text-sm font-bold shadow-sm transition-colors">Buka</button></td></tr>
                            )})}
                        </tbody>
                    </table></div></div>
                </div>
            );
        };

        const App = () => {
            const [teachers, setTeachers] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [user, setUser] = React.useState(null);
            const [auth, setAuth] = React.useState(null);
            const [reports, setReports] = React.useState({});
            const [pending, setPending] = React.useState([]);
            const [view, setView] = React.useState('login');
            const [date, setDate] = React.useState(getTodayMalaysia());
            const [toast, setToast] = React.useState(null);
            const [saving, setSaving] = React.useState(false);
            const [editTarget, setEditTarget] = React.useState(null);
            const [formKey, setFormKey] = React.useState(0);

            const showToast = (m, ms = 3500) => { setToast(m); setTimeout(()=>setToast(null), ms); };
            const getDay = d => isNaN(new Date(d))?'':['AHAD','ISNIN','SELASA','RABU','KHAMIS','JUMAAT','SABTU'][new Date(d).getDay()];

            const applyData = (d) => { if (d.reports) setReports(d.reports); setPending(d.pending || []); };
            const startSession = (u, pin, d) => {
                setUser(u); setAuth({ id: u.id, pin }); applyData(d);
                try { sessionStorage.setItem('smkkt_session', JSON.stringify({ id: u.id, pin })); } catch(e) {}
                setView(u.role === 'admin' ? 'admin' : 'mine');
            };
            const logout = () => { setUser(null); setAuth(null); setReports({}); setPending([]); try { sessionStorage.removeItem('smkkt_session'); } catch(e) {} setView('login'); };

            // Muat senarai nama (tanpa IC) dan pulihkan sesi jika masih ada
            React.useEffect(() => {
                (async () => {
                    try { const r = await fetch(GOOGLE_SCRIPT_URL); const d = await r.json(); if (d.teachers) setTeachers(d.teachers); } catch(e) {}
                    try {
                        const saved = JSON.parse(sessionStorage.getItem('smkkt_session') || 'null');
                        if (saved) { const d = await api({ action: 'DATA', id: saved.id, pin: saved.pin }); startSession(d.user, saved.pin, d); }
                    } catch(e) { try { sessionStorage.removeItem('smkkt_session'); } catch(e2) {} }
                    setLoading(false);
                })();
            }, []);

            const run = async (payload, okMsg) => {
                try { const d = await api({ ...auth, ...payload }); applyData(d); showToast(okMsg || d.message); return true; }
                catch (e) { if (e.status === 'auth') { showToast(e.message, 5000); logout(); } else showToast(e.message, 6000); return false; }
            };

            const saveReport = async (dt, id, data, imageArray) => {
                setSaving(true); showToast('Menyimpan... (gambar mungkin ambil 3-8 saat)', 8000);
                const okSaved = await run({ action: 'SAVE_REPORT', date: dt, week: data.week, dutyId: id, taskData: data, images: imageArray });
                setSaving(false);
                if (okSaved) { setEditTarget(null); setView('mine'); }
                return okSaved;
            };
            const deleteReport = async (dt, id, reviewed) => {
                const msg = 'Padam laporan ' + formatDateDisplay(dt) + ' (Tugas ' + id + ')?' + (reviewed ? '\n\nLaporan ini sudah disemak pentadbir.' : '') + '\n\nTindakan ini tidak boleh dibatalkan.';
                if (!window.confirm(msg)) return false;
                showToast('Memadam...', 5000);
                return run({ action: 'DELETE_REPORT', date: dt, dutyId: id });
            };
            const saveComment = (txt) => run({ action: 'SAVE_COMMENT', date, comment: txt, week: reports[date]?.week }, 'Ulasan pentadbir disimpan!');
            const decideTeacher = (targetId, decision) => run({ action: 'DECIDE_TEACHER', targetId, decision });

            const openForm = (target) => { setEditTarget(target); setFormKey(k => k + 1); setView('form'); };

            if (view === 'login') return <LoginScreen onLogin={startSession} teachers={teachers} loading={loading} />;
            return (
                <div className="min-h-screen flex flex-col pb-10">
                    {toast && <div className="fixed top-5 left-1/2 -translate-x-1/2 glass-panel bg-indigo-500/30 border-indigo-400 px-6 py-3.5 rounded-xl text-white z-50 animate-bounce text-sm shadow-[0_5px_30px_rgba(99,102,241,0.5)] font-bold flex items-center gap-3 backdrop-blur-xl"><i className="ph-fill ph-check-circle text-xl"></i> {toast}</div>}
                    <nav className="glass-panel mx-4 mt-4 p-4 rounded-xl flex justify-between items-center z-10 shadow-lg"><div className="font-bold text-white flex items-center gap-3"><div className="bg-white/10 p-1 rounded-full"><img src="./LOGO-SMKKT.png" className="w-8 h-8 object-contain drop-shadow-md"/></div><span className="tracking-wide text-sm sm:text-base">SMK KEM TERENDAK</span></div><div className="flex items-center gap-3"><span className="hidden sm:flex items-center gap-1.5 text-sm bg-black/20 border border-white/5 px-3 py-1.5 rounded-lg font-medium"><i className="ph-fill ph-user text-indigo-300"></i> {user.name}</span>{view==='report'&&<button onClick={()=>setView(user.role==='admin'?'admin':'list')} className="text-sm bg-white/10 hover:bg-white/20 border border-white/10 px-4 py-1.5 rounded-lg transition font-medium flex items-center gap-1.5"><i className="ph-bold ph-arrow-left"></i> Kembali</button>}<button onClick={logout} className="text-sm bg-rose-500/40 hover:bg-rose-500/60 border border-rose-500/50 px-4 py-1.5 rounded-lg text-white transition font-medium flex items-center gap-1.5"><i className="ph-bold ph-sign-out"></i> Keluar</button></div></nav>
                    {user.role === 'guru' && view !== 'report' && (() => { const cls = (v)=>`px-5 py-2.5 rounded-xl text-sm font-bold transition-all shadow-sm flex items-center gap-2 ${view===v?'glass-panel border-b-2 border-indigo-400 text-white shadow-[0_4px_20px_rgba(99,102,241,0.2)]':'bg-white/5 text-slate-400 hover:bg-white/10'}`; return <div className="flex justify-center gap-2 sm:gap-3 mt-6 px-4 flex-wrap"><button onClick={()=>openForm(null)} className={cls('form')}><i className="ph-bold ph-pencil-simple text-lg"></i> Isi Laporan</button><button onClick={()=>setView('mine')} className={cls('mine')}><i className="ph-bold ph-folder-user text-lg"></i> Laporan Saya</button><button onClick={()=>setView('list')} className={cls('list')}><i className="ph-bold ph-files text-lg"></i> Papar Rekod</button></div>; })()}
                    <main className="p-4 max-w-5xl w-full mx-auto mt-4 relative z-0">
                        {view === 'form' && <DutyForm key={formKey} user={user} saveReport={saveReport} deleteReport={deleteReport} saving={saving} initial={editTarget} reports={reports} getDayName={getDay} showToast={showToast} />}
                        {view === 'mine' && <MyReports reports={reports} user={user} onNew={()=>openForm(null)} onOpen={d=>{setDate(d);setView('report');}} onEdit={(d,id)=>openForm({date:d,dutyId:id})} onDelete={deleteReport} />}
                        {(view === 'admin' || view === 'list') && <AdminDashboard reports={reports} role={user.role} pending={pending} onDecide={decideTeacher} onViewReport={d=>{setDate(d);setView('report');}} />}
                        {view === 'report' && <CombinedReport reportData={reports[date]} date={date} user={user} onSaveComment={saveComment} />}
                    </main>
					<div className="text-center text-[10px] text-slate-500 mt-8 mb-4">
						<div className="font-semibold tracking-wide">
							Dibangunkan oleh ASYE
						</div>
						<div className="opacity-70">
							Unit ICT TRENDSS
						</div>
					</div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
